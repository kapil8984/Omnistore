name: OmniStore CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend:
    name: Backend Build & Tests (.NET 10)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore OrderInventorySystem.slnx

    - name: Build Backend Solution
      run: dotnet build OrderInventorySystem.slnx --configuration Release --no-restore

    - name: Run Backend Unit & Integration Tests
      run: dotnet test OrderInventorySystem.slnx --configuration Release --no-build --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=OrderInventoryDb;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true;"
        JWT_SECRET: "DevelopmentSecretKeyForOmniStoreSystemMustBe32BytesLong!"

  frontend:
    name: Frontend Build & Tests (React + Vitest)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package.json

    - name: Install Frontend Dependencies
      working-directory: ./client
      run: npm install --no-audit

    - name: Run Frontend Unit Tests
      working-directory: ./client
      run: npm test

    - name: Build Frontend Application
      working-directory: ./client
      run: npm run build
